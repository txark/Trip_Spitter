# --- Server Configuration ---
# Cloud ส่งพอร์ตมาทางตัวแปร PORT (เครื่องตัวเองใช้ 8090)
server.port=${PORT:8090}

# --- PostgreSQL Database Connection ---
# รหัสผ่านไม่เก็บใน git: ตั้งเป็น environment variable หรือใส่ในไฟล์ .env ที่โฟลเดอร์โปรเจกต์ (ดู .env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Trip_Spitter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Error response: ส่งข้อความจาก ResponseStatusException (ภาษาไทย) ไปใน field "message" ---
server.error.include-message=always

# --- Hibernate / JPA Configuration ---
# schema จัดการด้วย Flyway (db/migration) Hibernate แค่ตรวจว่า entity ตรงกับตาราง
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# ฐานข้อมูลเดิมที่มีตารางอยู่แล้ว: ถือเป็น V1 แล้วรันเฉพาะ V2 เป็นต้นไป (ฐานข้อมูลว่างจะรัน V1 เองตามปกติ)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# หน้าเว็บอยู่ใน resources/static (ไม่ได้ใช้ Thymeleaf template)
spring.thymeleaf.check-template-location=false

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
