<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Dashboard - Party & Trip Expense Splitter Pro</title>

    <!-- CSS กลาง -->
    <link rel="stylesheet" href="/src/main/resources/css/all.css" />
    <!-- Sidebar สำหรับจอคอม (≥1024px) -->
    <script defer src="/src/main/resources/js/sidebar.js"></script>
    <!-- ตัวช่วย UI ร่วม: fmt, esc, avatar, emptyBox, showToast -->
    <script src="/src/main/resources/js/ui.js"></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Momo+Trust+Display&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome สำหรับไอคอน -->
    <script
      src="https://kit.fontawesome.com/01502edf06.js"
      crossorigin="anonymous"
    ></script>
    <script rel="module" src="/src/main/resources/js/main.js"></script>
    <style>
      /* --- หัวหน้า: ตั๋วเครื่องบิน (boarding pass) ---
         ตัวตั๋ว (.bp-main) + ต้นขั้ว (.bp-stub) คั่นด้วยรอยปรุ
         รอยเว้าครึ่งวงกลมทำด้วย mask ที่แต่ละส่วน แล้วใช้ drop-shadow ที่ตัวแม่เป็นเส้นขอบตามรูปทรง */
      .dashboard-header {
        padding-top: 12px;
      }

      .boarding-pass {
        --notch: 11px;
        display: grid;
        grid-template-columns: 1fr;
        filter: drop-shadow(0 0 0.6px rgba(0, 0, 0, 0.3))
          drop-shadow(0 6px 14px rgba(79, 70, 229, 0.08));
      }

      .bp-main {
        background: var(--surface);
        border-radius: 18px 18px 0 0;
        padding: 18px 20px 16px;
        /* มือถือ: รอยเว้าที่มุมล่างซ้าย/ขวา */
        -webkit-mask:
          radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) left / 51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) right / 51% 100% no-repeat;
        mask:
          radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) left / 51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) right / 51% 100% no-repeat;
      }

      .bp-stub {
        background: var(--primary-soft);
        border-top: 2px dashed #c7d2fe;
        border-radius: 0 0 18px 18px;
        padding: 16px 20px;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "label copy"
          "code copy"
          "barcode barcode";
        align-items: center;
        column-gap: 12px;
        /* มือถือ: รอยเว้าที่มุมบนซ้าย/ขวา */
        -webkit-mask:
          radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) left / 51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) right / 51% 100% no-repeat;
        mask:
          radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) left / 51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) right / 51% 100% no-repeat;
      }

      .bp-label {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .bp-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .bp-top .bp-label {
        color: var(--primary);
      }

      .bp-top i {
        color: var(--primary);
      }

      .bp-main h2 {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 6px 0 16px;
        overflow-wrap: anywhere;
      }

      /* เส้นทาง: วันไป ── ⋆.° 𓆉 𓆝 𓆡⋆.° ── วันกลับ */
      .bp-route {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .bp-point strong {
        display: block;
        font-size: 1.15rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .bp-point small {
        font-size: 0.72rem;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .bp-point.end {
        text-align: right;
      }

      .bp-line {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .bp-ornament {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        color: #a5b4fc;
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .bp-ornament::before,
      .bp-ornament::after {
        content: "";
        flex: 1;
        border-top: 1.5px dashed #c7d2fe;
      }

      .bp-days {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .bp-footer {
        display: flex;
        gap: 24px;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .bp-footer .value {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .avatar-stack {
        display: flex;
      }

      .avatar-stack .avatar {
        width: 26px;
        height: 26px;
        font-size: 0.7rem;
        border: 2px solid var(--surface);
      }

      .avatar-stack .avatar + .avatar {
        margin-left: -8px;
      }

      .avatar-stack .more {
        background: var(--surface-muted);
        color: var(--text-muted);
      }

      /* ต้นขั้ว: รหัสเชิญ + บาร์โค้ด */
      .bp-stub .bp-label {
        grid-area: label;
      }

      .invite-code-text {
        grid-area: code;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: 0.12em;
        color: var(--text-main);
      }

      .copy-btn {
        grid-area: copy;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 10px;
        background-color: var(--surface);
        color: var(--text-main);
        border: 1px solid #c7d2fe;
        font-weight: 600;
        font-size: 0.82rem;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.2s,
          color 0.2s,
          border-color 0.2s;
      }

      .copy-btn.success {
        background-color: #dcfce7 !important;
        border-color: #bbf7d0 !important;
        color: var(--success) !important;
      }

      /* บาร์โค้ดตกแต่ง สร้างจากรหัสเชิญ (รหัสเดิมได้ลายเดิม) */
      .barcode {
        grid-area: barcode;
        display: flex;
        align-items: stretch;
        gap: 2px;
        height: 34px;
        margin-top: 12px;
        overflow: hidden;
      }

      .barcode span {
        background: var(--text-main);
        border-radius: 1px;
        flex-shrink: 0;
      }

      /* แท็บเล็ตขึ้นไป: ต้นขั้วอยู่ด้านขวา รอยปรุแนวตั้ง */
      @media (min-width: 768px) {
        .boarding-pass {
          grid-template-columns: 1fr 230px;
        }

        .bp-main {
          border-radius: 18px 0 0 18px;
          -webkit-mask:
            radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) top / 100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
          mask:
            radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) top / 100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
        }

        .bp-stub {
          border-top: none;
          border-left: 2px dashed #c7d2fe;
          border-radius: 0 18px 18px 0;
          grid-template-columns: 1fr;
          grid-template-areas:
            "label"
            "code"
            "barcode"
            "copy";
          align-content: center;
          row-gap: 4px;
          -webkit-mask:
            radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) top / 100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
          mask:
            radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) top / 100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
        }

        .bp-stub .copy-btn {
          justify-self: start;
          margin-top: 8px;
        }

        .barcode {
          margin-top: 6px;
        }
      }

      /* --- เมนูลัด (มือถือ/แท็บเล็ต; จอคอมใช้ sidebar แทน) --- */
      .quick-nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 16px 0 24px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 6px;
        text-decoration: none;
        color: var(--text-main);
        font-size: 0.75rem;
        font-weight: 600;
        transition: border-color 0.2s;
      }

      .nav-item i {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 12%, white);
      }

      /* --- เนื้อหาหลัก: จอคอมแบ่ง ซ้าย (บิลล่าสุด) / ขวา (สรุป) --- */
      .dash-grid {
        margin-top: 8px;
      }

      @media (min-width: 1024px) {
        .dash-grid {
          grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        }
      }

      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px;
      }

      .panel + .panel,
      .side-stack > section + section {
        margin-top: 24px;
      }

      /* ค่าใช้จ่ายล่าสุด: ใบเสร็จยาวใบเดียว (.receipt ใน all.css) */
      .receipt-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .receipt-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
      }

      .receipt-row + .receipt-row {
        border-top: 1.5px dotted var(--border);
      }

      .cat-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        color: var(--cat, var(--text-muted));
        background: color-mix(in srgb, var(--cat, #71717a) 10%, white);
      }

      .feed-info {
        flex: 1;
        min-width: 0;
      }

      .feed-info h4 {
        font-size: 0.92rem;
        font-weight: 700;
        margin: 0 0 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .feed-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.74rem;
        color: var(--text-muted);
        overflow: hidden;
        white-space: nowrap;
      }

      .feed-meta .avatar {
        width: 18px;
        height: 18px;
        font-size: 0.6rem;
      }

      .feed-meta .payer {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .feed-amount {
        font-size: 0.98rem;
        color: var(--text-main);
        flex-shrink: 0;
      }

      .receipt-total .money {
        font-size: 1.1rem;
        font-weight: 700;
      }

      /* แยกตามหมวดหมู่ */
      .cat-bar {
        display: flex;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--surface-muted);
        gap: 2px;
        margin-bottom: 14px;
      }

      .cat-bar span {
        background: var(--cat);
        transition: width 0.4s ease;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        font-size: 0.85rem;
      }

      .legend-row + .legend-row {
        border-top: 1px solid var(--border);
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--cat);
        flex-shrink: 0;
      }

      .legend-name {
        flex: 1;
        font-weight: 600;
      }

      .legend-pct {
        color: var(--text-muted);
        font-size: 0.78rem;
        width: 40px;
        text-align: right;
      }

      .legend-amount {
        font-weight: 700;
        min-width: 80px;
        text-align: right;
      }

      /* สมาชิก */
      .member-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
      }

      .member-row + .member-row {
        border-top: 1px solid var(--border);
      }

      .member-name {
        flex: 1;
        min-width: 0;
        font-size: 0.9rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .member-role {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);
        background: var(--surface-muted);
        padding: 2px 8px;
        border-radius: 999px;
        margin-left: 6px;
      }

      .member-role.me {
        color: var(--primary);
        background: var(--primary-soft);
      }

      .member-paid {
        text-align: right;
        font-size: 0.75rem;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .member-paid strong {
        display: block;
        font-size: 0.9rem;
        color: var(--text-main);
      }

      .empty-box {
        text-align: center;
        padding: 30px;
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        color: var(--text-muted);
        font-size: 0.88rem;
      }

      .panel .empty-box {
        border: none;
        padding: 16px;
      }

      .dashboard-footer {
        text-align: center;
        padding: 24px 0 8px;
        font-size: 0.8rem;
        margin-top: auto;
      }

      .dashboard-footer a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
      }

      @media (hover: hover) and (pointer: fine) {
        .nav-item:hover {
          border-color: var(--border-strong);
        }

        .copy-btn:not(.success):hover {
          border-color: var(--primary);
          color: var(--primary);
        }

        .dashboard-footer a:hover {
          text-decoration: underline;
        }
      }
    </style>
  </head>
  <body>
    <div class="container container--wide">
      <!-- ส่วนหัวแดชบอร์ด: ตั๋วเครื่องบิน แสดงชื่อทริป วันเดินทาง สมาชิก และรหัสเชิญ -->
      <header class="dashboard-header page-header">
        <div class="boarding-pass">
          <div class="bp-main">
            <div class="bp-top">
              <span class="bp-label">Boarding pass · ทริปของคุณ</span>
              <i class="fa-solid fa-plane"></i>
            </div>
            <h2 id="trip-title-display">กำลังโหลดชื่อทริป...</h2>

            <div class="bp-route">
              <div class="bp-point">
                <span class="bp-label">ออกเดินทาง</span>
                <strong id="bp-start">--</strong>
                <small id="bp-start-sub">&nbsp;</small>
              </div>
              <div class="bp-line" aria-hidden="true">
                <span class="bp-ornament">⋆.° 𓆉 𓆝 𓆡⋆.°</span>
                <span class="bp-days" id="bp-days"></span>
              </div>
              <div class="bp-point end">
                <span class="bp-label">กลับ</span>
                <strong id="bp-end">--</strong>
                <small id="bp-end-sub">&nbsp;</small>
              </div>
            </div>

            <div class="bp-footer">
              <div>
                <span class="bp-label">ผู้โดยสาร</span>
                <div class="value" id="trip-members-meta">-</div>
              </div>
            </div>
          </div>

          <!-- ต้นขั้วตั๋ว: รหัสเชิญสำหรับแชร์ให้เพื่อน -->
          <div class="bp-stub">
            <span class="bp-label">รหัสเชิญเพื่อน</span>
            <span class="invite-code-text" id="invite-code-display">------</span>
            <div class="barcode" id="bp-barcode" aria-hidden="true"></div>
            <button
              type="button"
              id="copyBtn"
              class="copy-btn"
              onclick="copyInviteCode()"
            >
              <i id="copyIcon" class="fa-regular fa-copy"></i>
              <span id="copyText">คัดลอก</span>
            </button>
          </div>
        </div>
      </header>

      <!-- แถบสรุปยอด -->
      <div class="stat-summary" aria-live="polite">
        <div class="stat-tile">
          <div class="stat-label">
            <i class="fa-solid fa-coins tone-amber"></i>
            ค่าใช้จ่ายทั้งทริป
          </div>
          <div class="stat-value" id="stat-total">
            <div class="skeleton-line"></div>
          </div>
          <div class="stat-sub" id="stat-total-sub"></div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">
            <i class="fa-solid fa-user tone-primary"></i>
            ส่วนของคุณ
          </div>
          <div class="stat-value" id="stat-share">
            <div class="skeleton-line"></div>
          </div>
          <div class="stat-sub" id="stat-share-sub"></div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">
            <i class="fa-solid fa-scale-balanced tone-success"></i>
            สุทธิของคุณ
          </div>
          <div class="stat-value" id="stat-net">
            <div class="skeleton-line"></div>
          </div>
          <div class="stat-sub" id="stat-net-sub"></div>
        </div>
      </div>

      <!-- เมนูลัด (จอคอมซ่อน เพราะมี sidebar แล้ว) -->
      <nav class="quick-nav">
        <a href="expenses.html" class="nav-item">
          <i class="fa-solid fa-receipt tone-primary"></i> ค่าใช้จ่าย
        </a>
        <a href="debts.html" class="nav-item">
          <i class="fa-solid fa-scale-balanced tone-success"></i> สรุปหนี้
        </a>
        <a href="polls.html" class="nav-item">
          <i class="fa-solid fa-square-poll-vertical tone-amber"></i> โหวต
        </a>
        <a href="checklist.html" class="nav-item">
          <i class="fa-solid fa-list-check tone-danger"></i> เช็คลิสต์
        </a>
      </nav>

      <div class="two-col dash-grid">
        <!-- ค่าใช้จ่ายล่าสุด -->
        <section>
          <div class="section-title">
            <span>ค่าใช้จ่ายล่าสุด</span>
          </div>
          <div id="expenses-feed-container">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
          </div>
        </section>

        <div class="side-stack">
          <!-- แยกตามหมวดหมู่ -->
          <section>
            <div class="section-title"><span>แยกตามหมวดหมู่</span></div>
            <div class="panel" id="category-panel">
              <div class="skeleton" style="height: 120px; margin: 0"></div>
            </div>
          </section>

          <!-- สมาชิก -->
          <section>
            <div class="section-title">
              <span>สมาชิก</span>
              <span class="count-pill" id="members-count" hidden></span>
            </div>
            <div class="panel" id="members-panel">
              <div class="skeleton" style="height: 120px; margin: 0"></div>
            </div>
          </section>
        </div>
      </div>

      <!-- ส่วนท้ายหน้า (จอคอมซ่อน เพราะมีใน sidebar แล้ว) -->
      <footer class="dashboard-footer">
        <a href="home.html"><i class="fa-solid fa-house"></i> กลับสู่หน้าแรก</a>
      </footer>
    </div>

    <script>
      // ดึง tripId จาก URL Parameters (เช่น dashboard.html?tripId=1)
      const urlParams = new URLSearchParams(window.location.search);
      const tripId = urlParams.get("tripId") || 1;
      const currentUserId = localStorage.getItem("userId") || 1;
      const currentUsername = localStorage.getItem("username");

      const API_BASE_URL = "http://localhost:8090/api"; // ปรับพอร์ตตาม Backend จริง

      // ส่ง tripId ต่อไปยังหน้าย่อย ไม่งั้นหน้าเหล่านั้นจะ fallback ไปเป็นทริป 1
      document
        .querySelectorAll(
          'a[href="expenses.html"], a[href="debts.html"], a[href="polls.html"], a[href="checklist.html"]',
        )
        .forEach((a) => {
          a.href = `${a.getAttribute("href")}?tripId=${encodeURIComponent(tripId)}`;
        });

      const CATEGORIES = {
        FOOD: { label: "อาหาร", icon: "fa-solid fa-utensils" },
        ACCOMMODATION: { label: "ที่พัก", icon: "fa-solid fa-hotel" },
        TRANSPORT: { label: "เดินทาง", icon: "fa-solid fa-car" },
        SHOPPING: { label: "ช้อปปิ้ง", icon: "fa-solid fa-shopping-bag" },
        OTHER: { label: "อื่นๆ", icon: "fa-solid fa-star" },
      };
      // รับเฉพาะหมวดที่รู้จัก (ค่าอื่นถือเป็น "อื่นๆ")
      const catKeyOf = (c) => (CATEGORIES[c] ? c : "OTHER");

      // --- วันที่ ---
      function parseDate(str) {
        if (!str) return null;
        const d = new Date(str);
        return isNaN(d) ? null : d;
      }

      function formatDay(d, withYear = false) {
        return d.toLocaleDateString("th-TH", {
          day: "numeric",
          month: "short",
          ...(withYear ? { year: "numeric" } : {}),
        });
      }

      function renderTripDates(trip) {
        const start = parseDate(trip.startDate);
        const end = parseDate(trip.endDate);
        // เช่น "วันอังคาร · 2569" (ประกอบเอง เพราะ toLocaleDateString เรียงเป็น "พ.ศ. 2569 อังคาร")
        const weekdayYear = (d) =>
          `${d.toLocaleDateString("th-TH", { weekday: "long" })} · ${d.getFullYear() + 543}`;

        document.getElementById("bp-start").textContent = start ? formatDay(start) : "--";
        document.getElementById("bp-start-sub").textContent = start ? weekdayYear(start) : "ยังไม่ระบุ";
        document.getElementById("bp-end").textContent = end ? formatDay(end) : "--";
        document.getElementById("bp-end-sub").textContent = end ? weekdayYear(end) : "ยังไม่ระบุ";
        document.getElementById("bp-days").textContent =
          start && end ? `${Math.round((end - start) / 86400000) + 1} วัน` : "";
      }

      // บาร์โค้ดตกแต่งจากรหัสเชิญ: แต่ละตัวอักษร -> เลขฐานสอง -> แท่งหนา/บาง
      function renderBarcode(code) {
        const bits = [...String(code || "")]
          .map((c) => c.charCodeAt(0).toString(2).padStart(8, "0"))
          .join("");
        document.getElementById("bp-barcode").innerHTML = [...bits.repeat(4)]
          .slice(0, 160) // ยาวพอเต็มต้นขั้วทุกขนาดจอ ส่วนเกินถูกตัดด้วย overflow: hidden
          .map((b, i) => `<span style="width:${b === "1" ? 3 : 1}px;${i % 7 === 0 ? "opacity:.45" : ""}"></span>`)
          .join("");
      }

      function renderMembersMeta(members) {
        const MAX = 5;
        const names = members.map((m) => m.guestName || `สมาชิก #${m.id}`);
        const stack =
          names
            .slice(0, MAX)
            .map((n) => avatar(n))
            .join("") +
          (names.length > MAX
            ? `<div class="avatar more">+${names.length - MAX}</div>`
            : "");
        document.getElementById("trip-members-meta").innerHTML =
          `<span class="avatar-stack">${stack}</span> ${members.length} คน`;
      }

      // --- สรุปยอด ---
      function renderStats(expenses, myMemberId) {
        const me = String(myMemberId);
        const total = expenses.reduce((s, e) => s + Number(e.totalAmount || 0), 0);

        let myShare = 0;
        let owe = 0; // ที่เราค้างคนอื่น
        let receive = 0; // ที่คนอื่นค้างเรา
        expenses.forEach((e) => {
          const payerIsMe = e.user && String(e.user.id) === me;
          (e.splits || []).forEach((s) => {
            const splitIsMe = s.tripMember && String(s.tripMember.id) === me;
            const amount = Number(s.amountOwed || 0);
            if (splitIsMe) myShare += amount;
            if (s.isPaid) return;
            if (splitIsMe && !payerIsMe) owe += amount;
            if (!splitIsMe && payerIsMe) receive += amount;
          });
        });

        document.getElementById("stat-total").textContent = fmt(total);
        document.getElementById("stat-total-sub").textContent =
          `${expenses.length} บิล`;
        document.getElementById("stat-share").textContent = fmt(myShare);
        document.getElementById("stat-share-sub").textContent =
          total > 0 ? `${Math.round((myShare / total) * 100)}% ของทั้งทริป` : "";

        const net = receive - owe;
        const netEl = document.getElementById("stat-net");
        netEl.textContent = fmt(Math.abs(net));
        netEl.className = `stat-value${net > 0 ? " text-success" : net < 0 ? " text-danger" : ""}`;
        document.getElementById("stat-net-sub").textContent =
          net > 0 ? "คุณจะได้รับคืน" : net < 0 ? "คุณต้องจ่ายเพิ่ม" : "เคลียร์ครบแล้ว 🎉";
      }

      // --- ค่าใช้จ่ายล่าสุด: ใบเสร็จยาวใบเดียว พร้อมยอดรวมทั้งทริปด้านล่าง ---
      function renderRecent(expenses) {
        const container = document.getElementById("expenses-feed-container");
        if (expenses.length === 0) {
          container.innerHTML = emptyBox(
            "fa-solid fa-receipt",
            "ยังไม่มีค่าใช้จ่ายในทริปนี้",
          );
          return;
        }
        const RECENT = 6;
        const total = expenses.reduce((s, e) => s + Number(e.totalAmount || 0), 0);
        const today = new Date().toLocaleDateString("th-TH", {
          day: "numeric",
          month: "short",
          year: "2-digit",
        });

        const rows = [...expenses]
          .sort((a, b) => Number(b.id) - Number(a.id)) // ล่าสุดขึ้นก่อน
          .slice(0, RECENT)
          .map((item) => {
            const key = catKeyOf(item.category);
            const cat = CATEGORIES[key];
            const payer = item.user
              ? item.user.guestName || `สมาชิก #${item.user.id}`
              : "ไม่ระบุ";
            const date = parseDate(item.expenseDate);
            return `
              <div class="receipt-row">
                <div class="cat-icon cat-${key}"><i class="${cat.icon}"></i></div>
                <div class="feed-info">
                  <h4>${esc(item.title)}</h4>
                  <div class="feed-meta">
                    ${avatar(payer)}
                    <span class="payer">${esc(payer)} จ่าย</span>
                    ${date ? `<span>· ${esc(formatDay(date))}</span>` : ""}
                  </div>
                </div>
                <div class="feed-amount money">${fmt(item.totalAmount)}</div>
              </div>`;
          })
          .join("");

        container.innerHTML = `
          <div class="receipt">
            <div class="receipt-head">
              <span class="receipt-no">Trip receipt · ${expenses.length} บิล</span>
              <span class="receipt-no">${esc(today)}</span>
            </div>
            <hr class="receipt-divider" />
            ${rows}
            <hr class="receipt-divider" />
            <div class="receipt-total">
              <span>รวมทั้งทริป</span>
              <span class="money">${fmt(total)}</span>
            </div>
          </div>`;
      }

      // --- แยกตามหมวดหมู่ ---
      function renderCategories(expenses) {
        const panel = document.getElementById("category-panel");
        const totals = {};
        expenses.forEach((e) => {
          const key = catKeyOf(e.category);
          totals[key] = (totals[key] || 0) + Number(e.totalAmount || 0);
        });
        const grand = Object.values(totals).reduce((a, b) => a + b, 0);
        if (grand === 0) {
          panel.innerHTML = emptyBox("fa-solid fa-chart-pie", "ยังไม่มีข้อมูล");
          return;
        }
        const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
        const pct = (v) => (v / grand) * 100;

        panel.innerHTML = `
          <div class="cat-bar" role="img" aria-label="สัดส่วนค่าใช้จ่ายแยกตามหมวดหมู่">
            ${rows
              .map(([k, v]) => `<span class="cat-${k}" style="width:${pct(v)}%"></span>`)
              .join("")}
          </div>
          ${rows
            .map(
              ([k, v]) => `
                <div class="legend-row">
                  <span class="legend-dot cat-${k}"></span>
                  <span class="legend-name">${CATEGORIES[k].label}</span>
                  <span class="legend-pct">${Math.round(pct(v))}%</span>
                  <span class="legend-amount">${fmt(v)}</span>
                </div>`,
            )
            .join("")}`;
      }

      // --- สมาชิก + ยอดที่แต่ละคนจ่ายไป ---
      function renderMembers(members, expenses, myMemberId) {
        const panel = document.getElementById("members-panel");
        const countPill = document.getElementById("members-count");
        countPill.hidden = members.length === 0;
        countPill.textContent = `${members.length} คน`;

        if (members.length === 0) {
          panel.innerHTML = emptyBox("fa-solid fa-user-plus", "ยังไม่มีสมาชิก");
          return;
        }
        const paidBy = {};
        expenses.forEach((e) => {
          if (!e.user) return;
          const id = String(e.user.id);
          paidBy[id] = (paidBy[id] || 0) + Number(e.totalAmount || 0);
        });

        panel.innerHTML = [...members]
          .sort((a, b) => (paidBy[b.id] || 0) - (paidBy[a.id] || 0))
          .map((m) => {
            const name = m.guestName || `สมาชิก #${m.id}`;
            const isMe = String(m.id) === String(myMemberId);
            const tag = isMe
              ? '<span class="member-role me">คุณ</span>'
              : m.role === "ADMIN"
                ? '<span class="member-role">ผู้สร้างทริป</span>'
                : "";
            return `
              <div class="member-row">
                ${avatar(name, "sm")}
                <span class="member-name">${esc(name)}${tag}</span>
                <span class="member-paid">จ่ายไป<strong>${fmt(paidBy[m.id] || 0)}</strong></span>
              </div>`;
          })
          .join("");
      }

      async function loadTripDashboard() {
        // 1. บันทึกประวัติการเข้าชมทริปล่าสุดลงฐานข้อมูล (ไม่ต้องรอ และไม่ให้พังทั้งหน้าถ้าล้มเหลว)
        fetch(
          `${API_BASE_URL}/history/view?userId=${currentUserId}&tripId=${tripId}`,
          { method: "POST" },
        ).catch((err) => console.error("Error saving history:", err));

        try {
          // 2. ดึงข้อมูลทริป สมาชิก และบิล พร้อมกัน
          const [tripRes, membersRes, expensesRes] = await Promise.all([
            fetch(`${API_BASE_URL}/trips/${tripId}`),
            fetch(`${API_BASE_URL}/trips/${tripId}/members`),
            fetch(`${API_BASE_URL}/expenses/trip/${tripId}`),
          ]);
          if (!tripRes.ok) throw new Error("ไม่สามารถดึงข้อมูลทริปได้");

          const trip = await tripRes.json();
          const members = membersRes.ok ? await membersRes.json() : [];
          const expenses = expensesRes.ok ? (await expensesRes.json()) || [] : [];

          // TripMember ผูกกับ User ด้วยชื่อ (guestName = username) ไม่ใช่ ID
          const myMember =
            members.find((m) => currentUsername && m.guestName === currentUsername) ||
            members[0];
          const myMemberId = myMember ? myMember.id : null;

          // 3. หัวหน้า
          document.getElementById("trip-title-display").textContent =
            trip.title || `ทริป #${tripId}`;
          document.title = `${trip.title || "Trip"} - Party & Trip Expense Splitter Pro`;
          document.getElementById("invite-code-display").textContent =
            trip.inviteCode || "------";
          renderBarcode(trip.inviteCode);
          renderTripDates(trip);
          renderMembersMeta(members);

          // 4. เนื้อหา
          renderStats(expenses, myMemberId);
          renderRecent(expenses);
          renderCategories(expenses);
          renderMembers(members, expenses, myMemberId);
        } catch (error) {
          console.error("Error loading dashboard:", error);
          document.getElementById("trip-title-display").textContent =
            "ไม่พบข้อมูลทริป";
          const box = emptyBox(
            "fa-solid fa-triangle-exclamation",
            "โหลดข้อมูลไม่สำเร็จ",
            true,
          );
          ["expenses-feed-container", "category-panel", "members-panel"].forEach(
            (id) => (document.getElementById(id).innerHTML = box),
          );
          ["stat-total", "stat-share", "stat-net"].forEach(
            (id) => (document.getElementById(id).textContent = "-"),
          );
        }
      }

      // คัดลอกรหัสเชิญ แล้วเปลี่ยนปุ่มเป็นสีเขียวชั่วครู่
      let copyTimeout;
      function copyInviteCode() {
        const code = document.getElementById("invite-code-display").textContent.trim();
        if (!code || code === "------") return;

        navigator.clipboard
          .writeText(code)
          .then(() => {
            const btn = document.getElementById("copyBtn");
            const icon = document.getElementById("copyIcon");
            const textSpan = document.getElementById("copyText");

            clearTimeout(copyTimeout);
            btn.classList.add("success");
            icon.className = "fa-solid fa-check";
            textSpan.textContent = "คัดลอกแล้ว";

            copyTimeout = setTimeout(() => {
              btn.classList.remove("success");
              icon.className = "fa-regular fa-copy";
              textSpan.textContent = "คัดลอก";
            }, 1500);
          })
          .catch((err) => {
            console.error("ไม่สามารถคัดลอกข้อความได้:", err);
            showToast("คัดลอกไม่สำเร็จ", "error");
          });
      }

      loadTripDashboard();
    </script>
  </body>
</html>
