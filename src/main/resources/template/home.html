<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party & Trip Expense Splitter Pro</title>

    <!-- CSS กลาง -->
    <link rel="stylesheet" href="/src/main/resources/css/all.css" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Momo+Trust+Display&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome สำหรับไอคอน -->
    <!-- <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    /> -->
    <script
      src="https://kit.fontawesome.com/01502edf06.js"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        background-color: var(--background);
        color: var(--text-main);
        margin: 0;
        padding: 0;
      }

      .frame {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 40px 20px;
      }

      /* แถบโปรไฟล์ผู้ใช้มุมขวาบน */
      .frame .rectangle {
        position: absolute;
        top: 36px;
        right: 40px;
        width: auto;
        min-width: 140px;
        height: 48px;
        background-color: var(--surface);
        border-radius: 100px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        padding: 0 16px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .frame .rectangle:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow-lg);
      }

      .frame .username {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-main);
        margin-left: 8px;
        white-space: nowrap;
      }

      .frame .vector {
        color: var(--primary);
        font-size: 1rem;
      }

      @media (max-width: 768px) {
        .frame .rectangle {
          width: 30px;
          padding: 0;
          justify-content: center;
          right: 20px;
          top: 20px;
        }
        .frame .username {
          display: none;
        }
        .frame .vector {
          margin: 0;
        }
      }

      /* ส่วนแสดงวันที่และเวลา */
      header {
        text-align: center;
        margin-top: 4em;
        margin-bottom: 2.5em;
      }

      .frame .text-wrapper {
        font-family: "Momo Trust Display", sans-serif;
        font-size: 1.8rem;
        font-weight: 500;
        color: var(--text-main);
        margin-bottom: 4px;
        display: block;
      }

      .frame .div {
        font-size: 3.5rem;
        font-weight: 400;
        color: var(--text-main);
        display: block;
        letter-spacing: 1px;
      }

      /* วิวเริ่มต้น (โลโก้ + ปุ่มใหญ่) */
      .initial-view {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 25px;
      }

      .center-brand {
        text-align: center;
        margin-top: 4em;
        margin-bottom: 35px;
      }

      .center-brand .text-wrapper-2 {
        font-family: "Momo Trust Display", sans-serif;
        font-size: 1.25em;
        font-weight: 400;
        color: var(--text-muted);
        margin-top: 6px;
      }

      .big-btn {
        width: 100%;
        height: 56px;
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s;
        margin-bottom: 14px;
      }

      .big-btn-create {
        background: linear-gradient(135deg, var(--secondary) 0%, #f97316 100%);
        border: none;
        color: #ffffff;
        box-shadow: 0 8px 20px rgba(255, 107, 107, 0.35);
      }

      .big-btn-create:hover {
        transform: translateY(-2px);
      }

      .big-btn-join {
        background-color: var(--surface);
        border: 2px solid var(--primary);
        color: var(--primary);
      }

      .big-btn-join:hover {
        background-color: rgba(99, 102, 241, 0.05);
      }
      @media (max-width: 768px) {
        .big-btn {
          height: 50px;
          width: 70%;
          font-size: 0.95rem;
          margin-bottom: 12px;
        }

        .initial-view {
          padding: 0 10px;
          width: 100%;
          box-sizing: border-box;
        }
      }

      /* วิวแท็บฟอร์ม (ถูกซ่อนไว้ตอนแรก) */
      .action-container {
        width: 100%;
        max-width: 480px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-sm);
        margin-bottom: 25px;
        display: none; /* ซ่อนไว้ก่อนจนกว่าจะคลิกปุ่มใหญ่ */
      }

      .tab-buttons {
        display: flex;
        background-color: var(--background);
        border-radius: var(--radius-md);
        padding: 4px;
        margin-bottom: 20px;
      }

      .tab-btn {
        flex: 1;
        padding: 10px;
        border: none;
        background: transparent;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        border-radius: 10px;
        transition: all 0.2s;
      }

      .tab-btn.active {
        background-color: var(--surface);
        color: var(--primary);
        box-shadow: var(--shadow-sm);
      }

      .form-section {
        display: none;
      }

      .form-section.active {
        display: block;
      }

      .input-group {
        margin-bottom: 14px;
        text-align: left;
      }

      .input-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .input-group input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background-color: var(--background);
        color: var(--text-main);
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .input-group input:focus {
        border-color: var(--primary);
      }

      .submit-btn {
        width: 100%;
        height: 48px;
        border-radius: 10px;
        border: none;
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
        margin-top: 10px;
      }

      .submit-btn:hover {
        opacity: 0.95;
        transform: translateY(-1px);
      }

      .btn-create {
        background: linear-gradient(135deg, var(--secondary) 0%, #f97316 100%);
        box-shadow: 0 6px 15px rgba(255, 107, 107, 0.3);
      }

      .btn-join {
        background-color: var(--primary);
        box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
      }

      @media (max-width: 768px) {
        .action-container {
          width: 80%;
          max-width: 480px;
          background-color: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          padding: 24px;
          box-shadow: var(--shadow-sm);
          margin-bottom: 25px;
          display: none; /* ซ่อนไว้ก่อนจนกว่าจะคลิกปุ่มใหญ่ */
        }
      }

      /* ส่วน History */
      .history-container {
        width: 100%;
        max-width: 480px;
      }

      .history-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .frame .text-wrapper-5 {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .frame .rectangle-4 {
        width: 100%;
        min-height: 56px;
        background-color: var(--surface);
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-decoration: none;
        color: var(--text-main);
        font-size: 0.88rem;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: 8px;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .history-item:hover {
        background-color: rgba(99, 102, 241, 0.05);
        color: var(--primary);
      }

      @media (max-width: 768px) {
        .history-container {
          width: 80%;
          max-width: 480px;
        }
        .action-container {
          padding: 20px 16px;
          border-radius: var(--radius-md);
        }

        .tab-btn {
          font-size: 0.88rem;
          padding: 8px 4px;
        }

        .input-group label {
          font-size: 0.8rem;
        }
        .input-group input {
          height: 44px;
          font-size: 0.9rem;
        }
        .submit-btn {
          height: 46px;
          font-size: 0.95rem;
        }
      }

      /* Custom Modal สำหรับเปลี่ยนชื่อ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s ease,
          visibility 0.2s ease;
      }
      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }
      .modal-box {
        background-color: var(--surface);
        width: 100%;
        max-width: 400px;
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <!-- แถบโปรไฟล์ผู้ใช้มุมขวาบน -->
      <aside aria-label="User account">
        <div
          class="rectangle"
          role="button"
          aria-label="เปิดเมนูผู้ใช้"
          onclick="openUsernameModal()"
          title="คลิกเพื่อเปลี่ยนชื่อเล่น"
        >
          <i class="fa-solid fa-user vector" aria-hidden="true"></i>
          <span class="username" id="username-display">Loading...</span>
        </div>
      </aside>

      <!-- แถบแสดงวันที่และเวลาแบบเรียลไทม์ -->
      <header aria-label="Current date and time">
        <time class="text-wrapper" id="current-date">Sat, Sep 26</time>
        <time class="div" id="current-time">20 : 49</time>
      </header>

      <!-- วิวเริ่มต้น: โลโก้และปุ่มใหญ่ (แสดงก่อนคลิก) -->
      <div id="initial-view" class="initial-view">
        <div class="center-brand">
          <i
            class="fa-solid fa-route fa-5x"
            style="color: rgba(139, 92, 246, 0.8)"
            aria-hidden="true"
          ></i>
          <div class="text-wrapper-2">Enjoy Your Time</div>
        </div>

        <button
          type="button"
          class="big-btn big-btn-create"
          onclick="openTabMode('create')"
        >
          <i class="fa-solid fa-circle-plus"></i> สร้างห้องใหม่
        </button>
        <button
          type="button"
          class="big-btn big-btn-join"
          onclick="openTabMode('join')"
        >
          <i class="fa-solid fa-link"></i> เข้าร่วมด้วยรหัสเชิญ
        </button>
      </div>

      <!-- วิวแท็บ: ซ่อนโลโก้และสลับแสดงฟอร์ม (แสดงเมื่อถูกคลิกจากวิวเริ่มต้น) -->
      <div class="action-container" id="tabbed-view">
        <div class="tab-buttons">
          <button
            type="button"
            class="tab-btn"
            id="btn-tab-create"
            onclick="switchTab('create')"
          >
            <i class="fa-solid fa-circle-plus"></i> สร้างห้องใหม่
          </button>
          <button
            type="button"
            class="tab-btn"
            id="btn-tab-join"
            onclick="switchTab('join')"
          >
            <i class="fa-solid fa-link"></i> รหัสเชิญ
          </button>
        </div>

        <!-- ฟอร์มสร้างทริปใหม่ -->
        <div class="form-section" id="section-create">
          <div class="input-group">
            <label>ชื่อห้อง</label>
            <input
              type="text"
              id="trip-title"
              placeholder="เช่น เที่ยวทะเลแก๊งเพื่อน"
            />
          </div>
          <div class="input-group">
            <label>วันที่เริ่มต้น</label>
            <input type="date" id="trip-start-date" />
          </div>
          <div class="input-group">
            <label>วันที่สิ้นสุด</label>
            <input type="date" id="trip-end-date" />
          </div>
          <!-- <a
            href="dashboard.html"
            style="color: inherit; text-decoration: none"
          > -->
          <button
            type="button"
            class="submit-btn btn-create"
            onclick="submitCreateTrip()"
          >
            ยืนยันสร้างห้อง
          </button>
          <!-- </a> -->
        </div>

        <!-- ฟอร์มเข้าร่วมทริปด้วยรหัสเชิญ -->
        <div class="form-section" id="section-join">
          <div class="input-group">
            <label>รหัสเชิญห้องทริป (7 หลัก)</label>
            <input
              type="text"
              id="join-invite-code"
              placeholder="เช่น A7B9X2Y"
              maxlength="7"
              style="
                text-transform: uppercase;
                font-family: monospace;
                font-size: 1rem;
                letter-spacing: 2px;
              "
            />
          </div>
          <p
            style="
              font-size: 0.8rem;
              color: var(--text-muted);
              margin-bottom: 14px;
            "
          >
            ระบบจะใช้ชื่อเล่นโปรไฟล์มุมขวาบนของคุณในการเข้าร่วมห้อง
          </p>
          <button
            type="button"
            class="submit-btn btn-join"
            onclick="submitJoinTrip()"
          >
            เข้าร่วมห้องทริป
          </button>
        </div>
      </div>

      <!-- ส่วน History (ดึงข้อมูลทริปที่เคยเปิดดูล่าสุดของ User) -->
      <section class="history-container" aria-labelledby="history-title">
        <div class="history-header">
          <i
            class="fa-solid fa-clock-rotate-left"
            style="color: var(--text-muted)"
          ></i>
          <span class="text-wrapper-5" id="history-title">Recent History</span>
        </div>
        <div
          class="rectangle-4"
          id="recent-trips-container"
          aria-label="ประวัติการใช้งาน"
        >
          <span
            style="
              color: var(--text-muted);
              font-size: 0.85rem;
              text-align: center;
              width: 100%;
              padding: 10px 0;
            "
            >กำลังโหลดประวัติทริป...</span
          >
        </div>
      </section>
    </main>

    <!-- Modal เปลี่ยนชื่อเล่น -->
    <div class="modal-overlay" id="username-modal">
      <div class="modal-box">
        <div style="font-size: 1.15rem; font-weight: 700; margin-bottom: 8px">
          <i class="fa-solid fa-user-pen" style="color: var(--primary)"></i>
          เปลี่ยนชื่อเล่นของคุณ
        </div>
        <div
          style="
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
          "
        >
          ระบุชื่อเล่นที่เพื่อนๆ จะเห็นในห้องทริป
        </div>
        <input
          type="text"
          id="username-input"
          style="
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 16px;
          "
        />
        <div style="display: flex; gap: 10px">
          <button
            type="button"
            onclick="closeUsernameModal()"
            style="
              flex: 1;
              height: 40px;
              border-radius: 10px;
              background: var(--background);
              border: 1px solid var(--border);
              font-weight: 600;
              cursor: pointer;
            "
          >
            ยกเลิก
          </button>
          <button
            type="button"
            onclick="saveUsername()"
            style="
              flex: 1;
              height: 40px;
              border-radius: 10px;
              background: var(--primary);
              border: none;
              color: #fff;
              font-weight: 600;
              cursor: pointer;
            "
          >
            บันทึก
          </button>
        </div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "http://localhost:8090/api"; // เชื่อมต่อพอร์ต Backend จริง
      let currentUserId = localStorage.getItem("userId") || 1;

      function openTabMode(tabName) {
        document.getElementById("initial-view").style.display = "none";
        document.getElementById("tabbed-view").style.display = "block";
        switchTab(tabName);
      }

      function switchTab(tabName) {
        const btnCreate = document.getElementById("btn-tab-create");
        const btnJoin = document.getElementById("btn-tab-join");
        const secCreate = document.getElementById("section-create");
        const secJoin = document.getElementById("section-join");

        if (tabName === "create") {
          btnCreate.classList.add("active");
          btnJoin.classList.remove("active");
          secCreate.classList.add("active");
          secJoin.classList.remove("active");
        } else {
          btnJoin.classList.add("active");
          btnCreate.classList.remove("active");
          secJoin.classList.add("active");
          secCreate.classList.remove("active");
        }
      }

      // แสดงเวลาแบบเรียลไทม์
      function updateDateTime() {
        const now = new Date();
        const dateOptions = {
          weekday: "short",
          month: "short",
          day: "numeric",
        };
        document.getElementById("current-date").innerText =
          now.toLocaleDateString("en-US", dateOptions);
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("current-time").innerText =
          `${hours} : ${minutes}`;
      }
      setInterval(updateDateTime, 1000);
      updateDateTime();

      // จัดการชื่อเล่น Guest
      async function loadUserData() {
        const usernameSpan = document.getElementById("username-display");
        let savedUsername = localStorage.getItem("username");

        if (!savedUsername) {
          savedUsername = "TripGuest_" + Math.floor(Math.random() * 900 + 100);
          localStorage.setItem("username", savedUsername);
        }
        usernameSpan.innerText = savedUsername;

        // ส่งชื่อไปบันทึก/ตรวจสอบในตาราง users ที่ Backend
        await registerOrUpdateUser(savedUsername);
      }

      function openUsernameModal() {
        const modal = document.getElementById("username-modal");
        const input = document.getElementById("username-input");
        input.value = localStorage.getItem("username") || "";
        modal.classList.add("active");
        input.focus();
        input.select();
      }

      function closeUsernameModal() {
        document.getElementById("username-modal").classList.remove("active");
      }

      async function registerOrUpdateUser(username) {
        try {
          const response = await fetch(
            `${API_BASE_URL}/users/login?username=${encodeURIComponent(username)}`,
            {
              method: "POST",
            },
          );
          if (response.ok) {
            const user = await response.json();
            localStorage.setItem("userId", user.id);
            currentUserId = user.id;
          }
        } catch (error) {
          console.error("ไม่สามารถบันทึกข้อมูลผู้ใช้ได้:", error);
        }
      }

      function saveUsername() {
        const newName = document.getElementById("username-input").value.trim();
        if (newName !== "") {
          localStorage.setItem("username", newName);
          document.getElementById("username-display").innerText = newName;
          closeUsernameModal();
          registerOrUpdateUser(newName); // บันทึกชื่อใหม่ลงตาราง users ทันที
        } else {
          alert("กรุณากรอกชื่อเล่น");
        }
      }

      // สร้างห้องทริปใหม่ส่งไป Backend
      async function submitCreateTrip() {
        const title = document.getElementById("trip-title").value.trim();
        const startDate = document.getElementById("trip-start-date").value;
        const endDate = document.getElementById("trip-end-date").value;
        const creatorName = localStorage.getItem("username") || "Guest";

        if (!title || !startDate || !endDate) {
          alert("กรุณากรอกข้อมูลทริปให้ครบถ้วน");
          return;
        }

        try {
          const response = await fetch(
            `${API_BASE_URL}/trips/create?creatorName=${encodeURIComponent(creatorName)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title, startDate, endDate }),
            },
          );

          if (response.ok) {
            const trip = await response.json();
            window.location.href = `dashboard.html?tripId=${trip.id}`;
          } else {
            alert("ไม่สามารถสร้างห้องทริปได้ กรุณาลองใหม่อีกครั้ง");
          }
        } catch (error) {
          alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์หลังบ้าน");
        }
      }

      // เข้าร่วมทริปด้วยรหัสเชิญส่งไป Backend
      async function submitJoinTrip() {
        const inviteCode = document
          .getElementById("join-invite-code")
          .value.trim()
          .toUpperCase();
        const memberName = localStorage.getItem("username") || "Guest";

        if (!inviteCode) {
          alert("กรุณากรอกรหัสเชิญห้องทริป");
          return;
        }

        try {
          const response = await fetch(
            `${API_BASE_URL}/trips/join/${inviteCode}?memberName=${encodeURIComponent(memberName)}`,
            {
              method: "POST",
            },
          );

          if (response.ok) {
            const member = await response.json();
            window.location.href = `dashboard.html?tripId=${member.trip.id}`;
          } else {
            alert("รหัสเชิญไม่ถูกต้อง หรือไม่พบห้องทริปนี้");
          }
        } catch (error) {
          alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์หลังบ้าน");
        }
      }

      // โหลดประวัติทริปล่าสุด
      async function loadRecentTrips() {
        const container = document.getElementById("recent-trips-container");
        try {
          const response = await fetch(
            `${API_BASE_URL}/history/recent/${currentUserId}`,
          );

          if (!response.ok) {
            // ถ้าดึงประวัติไม่ได้ (เช่น ผู้ใช้ใหม่ยังไม่มีในระบบ) ให้แสดงข้อความธรรมดาแทนการโยน Error พัง
            container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem; text-align: center; width: 100%; padding: 10px 0;">ยังไม่มีประวัติการเข้าชมทริป</span>`;
            return;
          }

          const historyList = await response.json();
          if (!historyList || historyList.length === 0) {
            container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem; text-align: center; width: 100%; padding: 10px 0;">ยังไม่มีประวัติการเข้าชมทริป</span>`;
            return;
          }

          container.innerHTML = "";
          historyList.forEach((item) => {
            const link = document.createElement("a");
            link.href = `dashboard.html?tripId=${item.tripId}`;
            link.className = "history-item";
            link.innerHTML = `
              <span>✈️ ทริปรหัส #${item.tripId}</span>
              <span style="font-size: 0.75rem; color: var(--text-muted);">${new Date(item.viewedAt).toLocaleDateString("th-TH")}</span>
            `;
            container.appendChild(link);
          });
        } catch (error) {
          // ป้องกันไม่ให้ Error ของประวัติไปบล็อกการสร้างห้อง
          container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem; text-align: center; width: 100%; padding: 10px 0;">ยังไม่มีประวัติทริปในระบบ</span>`;
        }
      }

      loadUserData();
      loadRecentTrips();
    </script>
  </body>
</html>
