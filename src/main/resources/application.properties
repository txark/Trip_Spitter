# --- Server Configuration ---
server.port=8090

# --- PostgreSQL Database Connection ---
# รหัสผ่านไม่เก็บใน git: ตั้งเป็น environment variable หรือใส่ในไฟล์ .env ที่โฟลเดอร์โปรเจกต์ (ดู .env.example)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Trip_Spitter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Error response: ส่งข้อความจาก ResponseStatusException (ภาษาไทย) ไปใน field "message" ---
server.error.include-message=always

# --- Hibernate / JPA Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# หน้าเว็บอยู่ใน resources/static (ไม่ได้ใช้ Thymeleaf template)
spring.thymeleaf.check-template-location=false
