<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Dashboard - Party & Trip Expense Splitter Pro</title>

    <!-- CSS กลาง -->
    <link rel="stylesheet" href="css/all.css" />
    <!-- Sidebar สำหรับจอคอม (≥1024px) -->
    <script defer src="js/sidebar.js"></script>
    <!-- ตัวช่วย UI ร่วม: fmt, esc, avatar, emptyBox, showToast -->
    <script src="js/ui.js"></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Momo+Trust+Display&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome สำหรับไอคอน -->
    <script
      src="https://kit.fontawesome.com/01502edf06.js"
      crossorigin="anonymous"
    ></script>
    <style>
      /* --- หัวหน้า: ตั๋วเครื่องบิน (boarding pass) ---
         ตัวตั๋ว (.bp-main) + ต้นขั้ว (.bp-stub) คั่นด้วยรอยปรุ
         รอยเว้าครึ่งวงกลมทำด้วย mask ที่แต่ละส่วน แล้วใช้ drop-shadow ที่ตัวแม่เป็นเส้นขอบตามรูปทรง */
      .dashboard-header {
        padding-top: 12px;
      }

      .boarding-pass {
        --notch: 11px;
        display: grid;
        grid-template-columns: 1fr;
        filter: drop-shadow(0 0 0.6px rgba(0, 0, 0, 0.3))
          drop-shadow(0 6px 14px rgba(79, 70, 229, 0.08));
      }

      .bp-main {
        background: var(--surface);
        border-radius: 18px 18px 0 0;
        padding: 18px 20px 16px;
        /* มือถือ: รอยเว้าที่มุมล่างซ้าย/ขวา */
        -webkit-mask:
          radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) left /
            51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000)
            right / 51% 100% no-repeat;
        mask:
          radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) left /
            51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000)
            right / 51% 100% no-repeat;
      }

      .bp-stub {
        background: var(--primary-soft);
        border-top: 2px dashed #c7d2fe;
        border-radius: 0 0 18px 18px;
        padding: 16px 20px;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "label copy"
          "code copy"
          "barcode barcode";
        align-items: center;
        column-gap: 12px;
        /* มือถือ: รอยเว้าที่มุมบนซ้าย/ขวา */
        -webkit-mask:
          radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) left /
            51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000)
            right / 51% 100% no-repeat;
        mask:
          radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) left /
            51% 100% no-repeat,
          radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000)
            right / 51% 100% no-repeat;
      }

      .bp-label {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .bp-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .bp-top .bp-label {
        color: var(--primary);
      }

      .bp-top i {
        color: var(--primary);
      }

      .bp-main h2 {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 6px 0 16px;
        overflow-wrap: anywhere;
      }

      /* เส้นทาง: วันไป ── ⋆.° 𓆉 𓆝 𓆡⋆.° ── วันกลับ */
      .bp-route {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .bp-point strong {
        display: block;
        font-size: 1.15rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .bp-point small {
        font-size: 0.72rem;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .bp-point.end {
        text-align: right;
      }

      .bp-line {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .bp-ornament {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        color: #a5b4fc;
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .bp-ornament::before,
      .bp-ornament::after {
        content: "";
        flex: 1;
        border-top: 1.5px dashed #c7d2fe;
      }

      .bp-days {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      /* ปุ่มแก้วันเดินทาง (จำนวนวัน + ดินสอ) */
      .bp-edit {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 2px 10px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
      }

      .bp-edit i {
        font-size: 0.65rem;
      }

      .bp-edit:hover,
      .bp-edit:focus-visible {
        border-color: var(--border);
        background: var(--surface-muted);
        color: var(--primary);
      }

      .dates-dialog {
        box-sizing: border-box;
        width: min(400px, calc(100vw - 32px));
        margin: auto;
        padding: 20px;
        overflow-x: hidden;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        color: var(--text-main);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      }

      .dates-dialog::backdrop {
        background: rgba(15, 23, 42, 0.45);
      }

      .dates-dialog h3 {
        margin: 0 0 14px;
        font-size: 1.05rem;
      }

      .dates-fields {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
      }

      .dates-fields label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .dates-fields input {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        height: 42px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text-main);
        font: inherit;
      }

      .dates-note {
        min-height: 1.2em;
        margin: 10px 0 0;
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .dates-note.error {
        color: var(--danger);
      }

      .dates-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }

      .dates-actions button {
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text-main);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .dates-actions .primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #ffffff;
      }

      @media (max-width: 420px) {
        .dates-fields {
          grid-template-columns: 1fr;
        }
      }

      .bp-footer {
        display: flex;
        gap: 24px;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .bp-footer .value {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .avatar-stack {
        display: flex;
      }

      .avatar-stack .avatar {
        width: 26px;
        height: 26px;
        font-size: 0.7rem;
        border: 2px solid var(--surface);
      }

      .avatar-stack .avatar + .avatar {
        margin-left: -8px;
      }

      .avatar-stack .more {
        background: var(--surface-muted);
        color: var(--text-muted);
      }

      /* ต้นขั้ว: รหัสเชิญ + บาร์โค้ด */
      .bp-stub .bp-label {
        grid-area: label;
      }

      .invite-code-text {
        grid-area: code;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: 0.12em;
        color: var(--text-main);
      }

      .copy-btn {
        grid-area: copy;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 10px;
        background-color: var(--surface);
        color: var(--text-main);
        border: 1px solid #c7d2fe;
        font-weight: 600;
        font-size: 0.82rem;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.2s,
          color 0.2s,
          border-color 0.2s;
      }

      .copy-btn.success {
        background-color: #dcfce7 !important;
        border-color: #bbf7d0 !important;
        color: var(--success) !important;
      }

      /* บาร์โค้ดตกแต่ง สร้างจากรหัสเชิญ (รหัสเดิมได้ลายเดิม) */
      .barcode {
        grid-area: barcode;
        display: flex;
        align-items: stretch;
        gap: 2px;
        height: 34px;
        margin-top: 12px;
        overflow: hidden;
      }

      .barcode span {
        background: var(--text-main);
        border-radius: 1px;
        flex-shrink: 0;
      }

      /* แท็บเล็ตขึ้นไป: ต้นขั้วอยู่ด้านขวา รอยปรุแนวตั้ง */
      @media (min-width: 768px) {
        .boarding-pass {
          grid-template-columns: 1fr 230px;
        }

        .bp-main {
          border-radius: 18px 0 0 18px;
          -webkit-mask:
            radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000)
              top / 100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000)
              bottom / 100% 51% no-repeat;
          mask:
            radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000)
              top / 100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000)
              bottom / 100% 51% no-repeat;
        }

        .bp-stub {
          border-top: none;
          border-left: 2px dashed #c7d2fe;
          border-radius: 0 18px 18px 0;
          grid-template-columns: 1fr;
          grid-template-areas:
            "label"
            "code"
            "barcode"
            "copy";
          align-content: center;
          row-gap: 4px;
          -webkit-mask:
            radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) top /
              100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000)
              bottom / 100% 51% no-repeat;
          mask:
            radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) top /
              100% 51% no-repeat,
            radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000)
              bottom / 100% 51% no-repeat;
        }

        .bp-stub .copy-btn {
          justify-self: start;
          margin-top: 8px;
        }

        .barcode {
          margin-top: 6px;
        }
      }

      /* --- การ์ด "ถัดไป" จากแพลนเที่ยว (แถบสีซ้ายตามประเภท) --- */
      .next-card {
        --cat: var(--primary);
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 16px 0;
        padding: 14px 16px 14px 20px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.2s;
      }

      .next-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--cat);
      }

      .next-icon {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.05rem;
        color: var(--cat);
        background: color-mix(in srgb, var(--cat) 12%, white);
      }

      .next-body {
        flex: 1;
        min-width: 0;
      }

      .next-label {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-muted);
      }

      .next-label .now {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--cat);
        color: #ffffff;
      }

      .next-title {
        margin-top: 2px;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 700;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .next-title .time {
        margin-right: 6px;
        font-family: var(--font-mono);
      }

      .next-sub {
        margin-top: 2px;
        overflow: hidden;
        font-size: 0.8125rem;
        color: var(--text-muted);
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .next-go {
        flex-shrink: 0;
        font-size: 0.8125rem;
        font-weight: 700;
        color: var(--primary);
      }

      @media (max-width: 520px) {
        .next-go span {
          display: none;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .next-card:hover {
          border-color: var(--cat);
        }
      }

      /* --- เมนูลัด (มือถือ/แท็บเล็ต; จอคอมใช้ sidebar แทน) --- */
      .quick-nav {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0 24px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 6px;
        text-decoration: none;
        color: var(--text-main);
        font-size: 0.75rem;
        font-weight: 600;
        transition: border-color 0.2s;
      }

      .nav-item i {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 12%, white);
      }

      /* --- เนื้อหาหลัก: จอคอมแบ่ง ซ้าย (บิลล่าสุด) / ขวา (สรุป) --- */
      .dash-grid {
        margin-top: 8px;
      }

      @media (min-width: 1024px) {
        .dash-grid {
          grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        }
      }

      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px;
      }

      .panel + .panel,
      .side-stack > section + section {
        margin-top: 24px;
      }

      /* ค่าใช้จ่ายล่าสุด: ใบเสร็จยาวใบเดียว (.receipt ใน all.css) */
      .receipt-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      /* เลื่อนดูค่าใช้จ่ายทีละวัน */
      .day-nav {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }

      .day-nav button {
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-main);
        cursor: pointer;
      }

      .day-nav button:disabled {
        opacity: 0.25;
        cursor: default;
      }

      .day-nav button:not(:disabled):hover {
        background: var(--surface-muted);
      }

      .day-nav .day-label {
        min-width: 64px;
        text-align: center;
        font-weight: 700;
        color: var(--text-main);
      }

      .receipt-total.sub {
        margin-top: 6px;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-muted);
      }

      .receipt-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
      }

      .receipt-row + .receipt-row {
        border-top: 1.5px dotted var(--border);
      }

      .cat-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        color: var(--cat, var(--text-muted));
        background: color-mix(in srgb, var(--cat, #71717a) 10%, white);
      }

      .feed-info {
        flex: 1;
        min-width: 0;
      }

      .feed-info h4 {
        font-size: 0.92rem;
        font-weight: 700;
        margin: 0 0 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .feed-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.74rem;
        color: var(--text-muted);
        overflow: hidden;
        white-space: nowrap;
      }

      .feed-meta .avatar {
        width: 18px;
        height: 18px;
        font-size: 0.6rem;
      }

      .feed-meta .payer {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .feed-amount {
        font-size: 0.98rem;
        color: var(--text-main);
        flex-shrink: 0;
      }

      .receipt-total .money {
        font-size: 1.1rem;
        font-weight: 700;
      }

      /* แผน vs จ่ายจริง */
      .pva-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 10px;
      }

      .pva-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .pva-total {
        font-size: 1.35rem;
        font-weight: 800;
      }

      .pva-target {
        text-align: right;
        font-size: 0.78rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .pva-target .money {
        color: var(--text-main);
        font-weight: 700;
      }

      .pva-track,
      .pva-bar {
        height: 8px;
        border-radius: 999px;
        background: var(--surface-muted);
        overflow: hidden;
      }

      .pva-track span,
      .pva-bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--primary);
        transition: width 0.4s ease;
      }

      .pva-track.over span,
      .pva-bar.over span {
        background: var(--danger);
      }

      .pva-note {
        margin: 6px 0 12px;
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .pva-row {
        padding: 8px 0;
        font-size: 0.85rem;
      }

      .pva-row + .pva-row {
        border-top: 1px solid var(--border);
      }

      .pva-row-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pva-row .pva-bar {
        height: 5px;
        margin: 6px 0 0 18px;
      }

      .pva-row .pva-bar span {
        background: var(--cat);
      }

      .pva-row .pva-bar.over span {
        background: var(--danger);
      }

      .pva-plan {
        min-width: 64px;
        text-align: right;
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
      }

      /* แยกตามหมวดหมู่ */
      .cat-bar {
        display: flex;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--surface-muted);
        gap: 2px;
        margin-bottom: 14px;
      }

      .cat-bar span {
        background: var(--cat);
        transition: width 0.4s ease;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        font-size: 0.85rem;
      }

      .legend-row + .legend-row {
        border-top: 1px solid var(--border);
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--cat);
        flex-shrink: 0;
      }

      .legend-name {
        flex: 1;
        font-weight: 600;
      }

      .legend-pct {
        color: var(--text-muted);
        font-size: 0.78rem;
        width: 40px;
        text-align: right;
      }

      .legend-amount {
        font-weight: 700;
        min-width: 80px;
        text-align: right;
      }

      /* สมาชิก */
      .member-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
      }

      .member-row + .member-row {
        border-top: 1px solid var(--border);
      }

      .member-name {
        flex: 1;
        min-width: 0;
        font-size: 0.9rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .member-role {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);
        background: var(--surface-muted);
        padding: 2px 8px;
        border-radius: 999px;

      .member-role.me {

      .member-recover {

      .empty-box {

      .dashboard-footer a {

      @media (hover: hover) and (pointer: fine) {

        .dashboard-footer a:hover {

      }
    </style>
  </head>
  <body>
    <div class="container container--wide">
      <!-- ส่วนหัวแดชบอร์ด: ตั๋วเครื่องบิน แสดงชื่อทริป วันเดินทาง สมาชิก และรหัสเชิญ -->
      <header class="dashboard-header page-header">
        <div class="boarding-pass">
          <div class="bp-main">
            <div class="bp-top">
              <span class="bp-label">Boarding pass · ทริปของคุณ</span>
              <i class="fa-solid fa-plane"></i>
            </div>
            <h2 id="trip-title-display">กำลังโหลดชื่อทริป...</h2>

            <div class="bp-route">
              <div class="bp-point">
                <span class="bp-label">เริ่มต้น</span>
                <strong id="bp-start">--</strong>
                <small id="bp-start-sub">&nbsp;</small>
              </div>
              <div class="bp-line">
                <span class="bp-ornament" aria-hidden="true">⋆.° 𓆉 𓆝 𓆡⋆.°</span>
                <button type="button" class="bp-edit" id="bp-edit" onclick="openDatesDialog()" aria-label="แก้วันเดินทาง">
                  <span class="bp-days" id="bp-days"></span>
                  <i class="fa-solid fa-pen" aria-hidden="true"></i>
                </button>
              </div>
              <div class="bp-point end">
                <span class="bp-label">สิ้นสุด</span>
                <strong id="bp-end">--</strong>
                <small id="bp-end-sub">&nbsp;</small>
              </div>
            </div>

            <div class="bp-footer">
              <div>
                <span class="bp-label">เพื่อนร่วมทาง</span>
                <div class="value" id="trip-members-meta">-</div>
              </div>
            </div>
          </div>

          <!-- ต้นขั้วตั๋ว: รหัสเชิญสำหรับแชร์ให้เพื่อน -->
          <div class="bp-stub">
            <span class="bp-label">รหัสเชิญเพื่อน</span>
            <span class="invite-code-text" id="invite-code-display"
              >------</span
            >
            <div class="barcode" id="bp-barcode" aria-hidden="true"></div>
            <button
              type="button"
              id="copyBtn"
              class="copy-btn"
              onclick="copyInviteCode()"
            >
              <i id="copyIcon" class="fa-regular fa-copy"></i>
              <span id="copyText">คัดลอก</span>
            </button>
          </div>
        </div>
      </header>

      <!-- แก้วันเดินทาง -->
      <dialog class="dates-dialog" id="dates-dialog" aria-labelledby="dates-title">
        <form id="dates-form" method="dialog" novalidate>
          <h3 id="dates-title">แก้วันเดินทาง</h3>
          <div class="dates-fields">
            <div>
              <label for="dates-start">วันเริ่มต้น</label>
              <input type="date" id="dates-start" required />
            </div>
            <div>
              <label for="dates-end">วันสิ้นสุด</label>
              <input type="date" id="dates-end" required />
            </div>
          </div>
          <p class="dates-note" id="dates-note" aria-live="polite"></p>
          <div class="dates-actions">
            <button type="button" onclick="closeDatesDialog()">ยกเลิก</button>
            <button type="submit" class="primary" id="dates-save">บันทึก</button>
          </div>
        </form>
      </dialog>

      <!-- แถบสรุปยอด -->
      <div class="stat-summary" aria-live="polite">
        <div class="stat-tile">
          <div class="stat-label">
            <i class="fa-solid fa-coins tone-amber"></i>
            ค่าใช้จ่ายทั้งทริป
          </div>
          <div class="stat-value" id="stat-total">
            <div class="skeleton-line"></div>
          </div>
          <div class="stat-sub" id="stat-total-sub"></div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">
            <i class="fa-solid fa-user tone-primary"></i>
            ส่วนของคุณ
          </div>
          <div class="stat-value" id="stat-share">
            <div class="skeleton-line"></div>
          </div>
          <div class="stat-sub" id="stat-share-sub"></div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">
            <i class="fa-solid fa-scale-balanced tone-success"></i>
            สุทธิของคุณ
          </div>
          <div class="stat-value" id="stat-net">
            <div class="skeleton-line"></div>
          </div>
          <div class="stat-sub" id="stat-net-sub"></div>
        </div>
      </div>

      <!-- รายการถัดไปในแพลนเที่ยว (โหลดแพลนไม่ได้ = ซ่อน) -->
      <a class="next-card hidden" id="next-card" href="plan.html" aria-live="polite"></a>

      <!-- เมนูลัด (จอคอมซ่อน เพราะมี sidebar แล้ว) -->
      <nav class="quick-nav">
        <a href="plan.html" class="nav-item">
          <i class="fa-solid fa-route" style="--tone: #7c3aed"></i> แพลน
        </a>
        <a href="expenses.html" class="nav-item">
          <i class="fa-solid fa-receipt tone-primary"></i> ค่าใช้จ่าย
        </a>
        <a href="debts.html" class="nav-item">
          <i class="fa-solid fa-scale-balanced tone-success"></i> สรุปหนี้
        </a>
        <a href="polls.html" class="nav-item">
          <i class="fa-solid fa-square-poll-vertical tone-amber"></i> โหวต
        </a>
        <a href="checklist.html" class="nav-item">
          <i class="fa-solid fa-list-check tone-danger"></i> เช็คลิสต์
        </a>
      </nav>

      <div class="two-col dash-grid">
        <!-- ค่าใช้จ่ายล่าสุด -->
        <section>
          <div class="section-title">
            <span>ค่าใช้จ่ายล่าสุด</span>
          </div>
          <div id="expenses-feed-container">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
          </div>
        </section>

        <div class="side-stack">
          <!-- แยกตามหมวดหมู่ -->
          <section>
            <div class="section-title">
              <span>แผน vs จ่ายจริง</span>
              <button type="button" class="summary-open-btn" onclick="openTripSummary(tripId)">
                <i class="fa-solid fa-share-nodes"></i> แชร์สรุปทริป
              </button>
            </div>
            <div class="panel" id="category-panel">
              <div class="skeleton" style="height: 120px; margin: 0"></div>
            </div>
          </section>

          <!-- สมาชิก -->
          <section>
            <div class="section-title">
              <span>สมาชิก</span>
              <span class="count-pill" id="members-count" hidden></span>
            </div>
            <div class="panel" id="members-panel">
              <div class="skeleton" style="height: 120px; margin: 0"></div>
            </div>
          </section>
        </div>
      </div>

      <!-- ส่วนท้ายหน้า (จอคอมซ่อน เพราะมีใน sidebar แล้ว) -->
      <footer class="dashboard-footer">
        <a href="home.html"><i class="fa-solid fa-house"></i> กลับสู่หน้าแรก</a>
      </footer>
    </div>

    <script>
      // ดึง tripId จาก URL Parameters (เช่น dashboard.html?tripId=1)
      const urlParams = new URLSearchParams(window.location.search);
      const tripId = urlParams.get("tripId") || 1;
      // ไม่รู้ว่าเป็นใคร = ไม่บันทึกประวัติ (เดิมใช้ 1 ทำให้ประวัติไปโผล่ในบัญชีของผู้ใช้ #1)
      const currentUserId = localStorage.getItem("userId");
      const currentUsername = localStorage.getItem("username");

      const API_BASE_URL = API_BASE; // ตั้งที่ ui.js

      // ส่ง tripId ต่อไปยังหน้าย่อย ไม่งั้นหน้าเหล่านั้นจะ fallback ไปเป็นทริป 1
      document
        .querySelectorAll(
          'a[href="plan.html"], a[href="expenses.html"], a[href="debts.html"], a[href="polls.html"], a[href="checklist.html"]',
        )
        .forEach((a) => {
          a.href = `${a.getAttribute("href")}?tripId=${encodeURIComponent(tripId)}`;
        });

      // หมวดหมู่ใช้ร่วมกับหน้าค่าใช้จ่าย/แพลน (ui.js)
      const CATEGORIES = Object.fromEntries(EXPENSE_CATEGORIES.map((c) => [c.value, c]));
      // ข้อมูลล่าสุดของหน้า (การ์ดแผน vs จ่ายจริงต้องใช้ทั้งบิลและแพลน ซึ่งโหลดแยกกัน)
      let dashTrip = null;
      let dashMembers = [];
      let dashExpenses = [];
      let dashMyMemberId = null;
      // รับเฉพาะหมวดที่รู้จัก (ค่าอื่นถือเป็น "อื่นๆ")
      const catKeyOf = (c) => (CATEGORIES[c] ? c : "OTHER");

      // --- วันที่ ---
      function parseDate(str) {
        if (!str) return null;
        const d = new Date(str);
        return isNaN(d) ? null : d;
      }

      // --- แก้วันเดินทาง ---
      const datesDialog = document.getElementById("dates-dialog");
      const datesStart = document.getElementById("dates-start");
      const datesEnd = document.getElementById("dates-end");
      const datesNote = document.getElementById("dates-note");
      const isoDay = (v) => String(v || "").slice(0, 10);

      function openDatesDialog() {
        if (!dashTrip) return;
        datesStart.value = isoDay(dashTrip.startDate);
        datesEnd.value = isoDay(dashTrip.endDate);
        datesEnd.min = datesStart.value;
        updateDatesNote();
        datesDialog.showModal();
        datesStart.focus();
      }

      function closeDatesDialog() {
        datesDialog.close();
      }

      function datesProblem() {
        const start = datesStart.value;
        const end = datesEnd.value;
        if (!start || !end) return "กรุณาเลือกทั้งวันเริ่มต้นและวันสิ้นสุด";
        if (end < start) return "วันสิ้นสุดต้องไม่ก่อนวันเริ่มต้น";
        return "";
      }

      // บอกจำนวนวัน + เตือนถ้ามีบิล/รายการในแพลนอยู่นอกช่วงใหม่ (ไม่ลบ แค่บอก)
      function updateDatesNote() {
        datesEnd.min = datesStart.value || "";
        const problem = datesProblem();
        datesNote.classList.toggle("error", !!problem);
        if (problem) {
          datesNote.textContent = problem;
          return;
        }
        const start = datesStart.value;
        const end = datesEnd.value;
        const days = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
        const outside = (d) => d && (d < start || d > end);
        const bills = dashExpenses.filter((e) => outside(isoDay(e.expenseDate))).length;
        const plans = (planActivities || []).filter((a) => outside(isoDay(a.activityDate))).length;
        const extra = [bills && `${bills} บิล`, plans && `${plans} รายการในแพลน`].filter(Boolean).join(" และ ");
        datesNote.textContent = `${days} วัน` + (extra ? ` · มี ${extra} อยู่นอกช่วงนี้ (ยังเก็บไว้ ไม่ถูกลบ)` : "");
      }

      datesStart.addEventListener("input", () => {
        // เลื่อนวันเริ่มไปหลังวันสิ้นสุด = เลื่อนวันสิ้นสุดตาม
        if (datesEnd.value && datesStart.value > datesEnd.value) datesEnd.value = datesStart.value;
        updateDatesNote();
      });
      datesEnd.addEventListener("input", updateDatesNote);
      datesDialog.addEventListener("click", (e) => {
        if (e.target === datesDialog) closeDatesDialog();
      });

      document.getElementById("dates-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const problem = datesProblem();
        if (problem) {
          updateDatesNote();
          return;
        }
        const save = document.getElementById("dates-save");
        save.disabled = true;
        try {
          const res = await fetch(
            `${API_BASE_URL}/trips/${tripId}/dates?memberId=${dashMyMemberId ?? ""}&startDate=${datesStart.value}&endDate=${datesEnd.value}`,
            { method: "PUT" },
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.message || "บันทึกวันเดินทางไม่สำเร็จ");
          dashTrip = data;
          renderTripDates(data);
          renderNextCard();
          closeDatesDialog();
          showToast("แก้วันเดินทางแล้ว");
        } catch (error) {
          datesNote.classList.add("error");
          datesNote.textContent = error.message;
        } finally {
          save.disabled = false;
        }
      });

      function formatDay(d, withYear = false) {
        return d.toLocaleDateString("th-TH", {
          day: "numeric",
          month: "short",
          ...(withYear ? { year: "numeric" } : {}),
        });
      }

      function renderTripDates(trip) {
        const start = parseDate(trip.startDate);
        const end = parseDate(trip.endDate);
        // เช่น "วันอังคาร · 2569" (ประกอบเอง เพราะ toLocaleDateString เรียงเป็น "พ.ศ. 2569 อังคาร")
        const weekdayYear = (d) =>
          `${d.toLocaleDateString("th-TH", { weekday: "long" })} · ${d.getFullYear() + 543}`;

        document.getElementById("bp-start").textContent = start
          ? formatDay(start)
          : "--";
        document.getElementById("bp-start-sub").textContent = start
          ? weekdayYear(start)
          : "ยังไม่ระบุ";
        document.getElementById("bp-end").textContent = end
          ? formatDay(end)
          : "--";
        document.getElementById("bp-end-sub").textContent = end
          ? weekdayYear(end)
          : "ยังไม่ระบุ";
        document.getElementById("bp-days").textContent =
          start && end ? `${Math.round((end - start) / 86400000) + 1} วัน` : "";
      }

      // บาร์โค้ดตกแต่งจากรหัสเชิญ: แต่ละตัวอักษร -> เลขฐานสอง -> แท่งหนา/บาง
      function renderBarcode(code) {
        const bits = [...String(code || "")]
          .map((c) => c.charCodeAt(0).toString(2).padStart(8, "0"))
          .join("");
        document.getElementById("bp-barcode").innerHTML = [...bits.repeat(4)]
          .slice(0, 160) // ยาวพอเต็มต้นขั้วทุกขนาดจอ ส่วนเกินถูกตัดด้วย overflow: hidden
          .map(
            (b, i) =>
              `<span style="width:${b === "1" ? 3 : 1}px;${i % 7 === 0 ? "opacity:.45" : ""}"></span>`,
          )
          .join("");
      }

      function renderMembersMeta(members) {
        const MAX = 5;
        const names = members.map((m) => m.guestName || `สมาชิก #${m.id}`);
        const stack =
          names
            .slice(0, MAX)
            .map((n) => avatar(n))
            .join("") +
          (names.length > MAX
            ? `<div class="avatar more">+${names.length - MAX}</div>`
            : "");
        document.getElementById("trip-members-meta").innerHTML =
          `<span class="avatar-stack">${stack}</span> ${members.length} คน`;
      }

      // --- สรุปยอด ---
      function renderStats(expenses, myMemberId, budget = 0) {
        const me = String(myMemberId);
        const total = expenses.reduce(
          (s, e) => s + Number(e.totalAmount || 0),
          0,
        );

        let myShare = 0;
        let owe = 0; // ที่เราค้างคนอื่น
        let receive = 0; // ที่คนอื่นค้างเรา
        expenses.forEach((e) => {
          const payerIsMe = e.user && String(e.user.id) === me;
          (e.splits || []).forEach((s) => {
            const splitIsMe = s.tripMember && String(s.tripMember.id) === me;
            const amount = Number(s.amountOwed || 0);
            if (splitIsMe) myShare += amount;
            if (s.isPaid) return;
            const left = amount - Number(s.paidAmount || 0); // จ่ายมาบางส่วนแล้ว
            if (left <= 0) return;
            if (splitIsMe && !payerIsMe) owe += left;
            if (!splitIsMe && payerIsMe) receive += left;
          });
        });

        document.getElementById("stat-total").textContent = fmt(total);
        document.getElementById("stat-total-sub").textContent =
          `${expenses.length} บิล`;
        document.getElementById("stat-share").textContent = fmt(myShare);
        // ตั้งงบต่อคนไว้ (หน้าแพลน) = เทียบส่วนของคุณกับงบ
        const shareSub = document.getElementById("stat-share-sub");
        shareSub.classList.toggle("text-danger", budget > 0 && myShare > budget);
        shareSub.textContent =
          budget > 0
            ? myShare > budget
              ? `เกินงบ ${fmt(roundMoney(myShare - budget))} (งบ ${fmt(budget)})`
              : `${Math.round((myShare / budget) * 100)}% ของงบ ${fmt(budget)}`
            : total > 0
              ? `${Math.round((myShare / total) * 100)}% ของทั้งทริป`
              : "";

        const net = roundMoney(receive - owe);
        const netEl = document.getElementById("stat-net");
        netEl.textContent = fmt(Math.abs(net));
        netEl.className = `stat-value${net > 0 ? " text-success" : net < 0 ? " text-danger" : ""}`;
        document.getElementById("stat-net-sub").textContent =
          net > 0
            ? "คุณจะได้รับคืน"
            : net < 0
              ? "คุณต้องจ่ายเพิ่ม"
              : " "; // ไม่ค้างใคร: ว่างไว้ ให้การ์ดสูงเท่ากัน
      }

      // --- ค่าใช้จ่ายล่าสุด: แสดงทีละวัน (เริ่มที่วันนี้ ถ้าวันนี้ยังไม่มีบิล = วันล่าสุดที่มี) ---
      const dayKeyOf = (e) => String(e.expenseDate || "").slice(0, 10);
      const pad2 = (n) => String(n).padStart(2, "0");
      const shortDay = (key) => `${key.slice(8, 10)}/${key.slice(5, 7)}`;
      let recentExpenses = [];
      let recentDay = null;

      function todayKey() {
        const now = zoneNow(tripTimeZone);
        return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
      }

      function renderRecent(expenses) {
        recentExpenses = expenses;
        const container = document.getElementById("expenses-feed-container");
        if (expenses.length === 0) {
          container.innerHTML = emptyBox(
            "fa-solid fa-receipt",
            "ยังไม่มีค่าใช้จ่ายในทริปนี้",
          );
          return;
        }
        const total = expenses.reduce(
          (s, e) => s + Number(e.totalAmount || 0),
          0,
        );
        // วันที่มีบิล เรียงเก่า -> ใหม่
        const days = [...new Set(expenses.map(dayKeyOf).filter(Boolean))].sort();
        if (!days.includes(recentDay)) {
          const today = todayKey();
          recentDay = days.includes(today) ? today : days.at(-1) || null;
        }
        const index = days.indexOf(recentDay);
        const dayItems = expenses.filter((e) => (dayKeyOf(e) || null) === recentDay);
        const dayTotal = dayItems.reduce((sum, e) => sum + Number(e.totalAmount || 0), 0);
        const isToday = recentDay === todayKey();

        const rows = [...dayItems]
          .sort((a, b) => Number(b.id) - Number(a.id)) // ล่าสุดขึ้นก่อน

      // --- แผน vs จ่ายจริง แยกตามหมวด (หมวดเดียวกับในแพลน) ---
      function renderCategories() {
        const panel = document.getElementById("category-panel");
        const actual = {};
        const planned = {};
        dashExpenses.forEach((e) => {
          const key = catKeyOf(e.category);
          actual[key] = (actual[key] || 0) + Number(e.totalAmount || 0);
        });
        (planActivities || []).forEach((a) => {
          const key = catKeyOf(PLAN_TO_EXPENSE_CATEGORY[a.category] || "OTHER");
          const est = planEstimateBaht(a, dashTrip, dashMembers.length);
          if (est > 0) planned[key] = (planned[key] || 0) + est;
        });
        const totalActual = Object.values(actual).reduce((a, b) => a + b, 0);
        const totalPlan = Object.values(planned).reduce((a, b) => a + b, 0);
        const budget = (Number(dashTrip?.budgetPerPerson) || 0) * Math.max(dashMembers.length, 1);
        if (totalActual === 0 && totalPlan === 0) {
          panel.innerHTML = emptyBox("fa-solid fa-chart-pie", "ยังไม่มีบิลหรือราคาในแพลน");
          return;
        }

        // เป้าที่เทียบ: งบทริป (ถ้าตั้งไว้) ไม่งั้นยอดตามแผน
        const target = budget || totalPlan;
        const pctOf = (v, of) => (of > 0 ? Math.min((v / of) * 100, 100) : 0);
        const over = target > 0 && totalActual > target;
        const keys = EXPENSE_CATEGORIES.map((c) => c.value)
          .filter((k) => actual[k] > 0 || planned[k] > 0)
          .sort((a, b) => (actual[b] || 0) - (actual[a] || 0) || (planned[b] || 0) - (planned[a] || 0));

        const head = `
          <div class="pva-head">
            <div>
              <div class="pva-label">จ่ายจริงแล้ว</div>
              <div class="pva-total money${over ? " text-danger" : ""}">${fmt(totalActual)}</div>
            </div>
            <div class="pva-target">
              ${totalPlan > 0 ? `<div>แผน <span class="money">${fmt(Math.round(totalPlan))}</span></div>` : ""}
              ${budget > 0 ? `<div>งบทริป <span class="money">${fmt(budget)}</span></div>` : ""}
            </div>
          </div>
          ${
            target > 0
              ? `<div class="pva-track${over ? " over" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                   aria-valuenow="${Math.round(pctOf(totalActual, target))}">
                   <span style="width:${pctOf(totalActual, target)}%"></span>
                 </div>
                 <div class="pva-note${over ? " text-danger" : ""}">${
                   over
                     ? `เกิน${budget ? "งบ" : "แผน"}ไป ${fmt(Math.round(totalActual - target))}`
                     : `เหลืออีก ${fmt(Math.round(target - totalActual))} จาก${budget ? "งบ" : "แผน"}`
                 }</div>`
              : ""
          }`;

        const rows = keys
          .map((k) => {
            const a = actual[k] || 0;
            const p = Math.round(planned[k] || 0);
            const catOver = p > 0 && a > p;
            return `
              <div class="pva-row cat-${k}">
                <div class="pva-row-top">
                  <span class="legend-dot"></span>
                  <span class="legend-name">${CATEGORIES[k].label}</span>
                  <span class="legend-amount${catOver ? " text-danger" : ""}">${fmt(a)}</span>
                  <span class="pva-plan">${p > 0 ? `/ ${fmt(p)}` : "ไม่มีในแผน"}</span>
                </div>
                ${
                  p > 0
                    ? `<div class="pva-bar${catOver ? " over" : ""}"><span style="width:${pctOf(a, p)}%"></span></div>`
                    : ""
                }
              </div>`;
          })
          .join("");
        panel.innerHTML = head + rows;
      }

      // --- ถัดไปในแพลน ---
      const PLAN_ICONS = {
        TRAVEL: ["fa-solid fa-route", "#0284c7"],
        FOOD: ["fa-solid fa-utensils", "#ea580c"],
        STAY: ["fa-solid fa-bed", "#7c3aed"],
        SIGHTSEEING: ["fa-solid fa-camera", "#16a34a"],
        ACTIVITY: ["fa-solid fa-person-hiking", "#db2777"],
        OTHER: ["fa-solid fa-star", "#71717a"],
      };
      const MODE_ICONS = {
        CAR: "fa-solid fa-car",
        VAN: "fa-solid fa-van-shuttle",
        BUS: "fa-solid fa-bus",
        TRAIN: "fa-solid fa-train",
        PLANE: "fa-solid fa-plane",
        BOAT: "fa-solid fa-ship",
      };
      // รายการที่ไม่มีเวลาจบ (เช่น มื้ออาหาร) ถือว่า "ตอนนี้" อยู่ 1 ชั่วโมง
      const DEFAULT_DURATION_MS = 60 * 60000;
      let planActivities = null;
      let tripTimeZone = null; // เขตเวลาของทริป (ตั้งในหน้าแพลน)

      const hhmm = (t) => (t ? String(t).slice(0, 5) : "");
      const dayKey = (v) => String(v || "").slice(0, 10);
      const atTime = (key, time) => new Date(`${key}T${time ? hhmm(time) : "00:00"}:00`);
      const localKey = (d) =>
        `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

      // แตกแพลนเป็นเหตุการณ์ตามเวลา: ที่พัก = เช็คอิน + เช็คเอาท์, ข้ามคืน = จบวันถัดไป
      function planEvents(activities) {
        const events = [];
        activities.forEach((act) => {
          const key = dayKey(act.activityDate);
          if (!key) return;
          const [icon, color] = PLAN_ICONS[act.category] || PLAN_ICONS.OTHER;
          const base = { act, icon, color };
          if (act.category === "STAY") {
            const start = atTime(key, act.startTime);
            events.push({ ...base, key, time: act.startTime, start, end: new Date(+start + DEFAULT_DURATION_MS), label: `เช็คอิน ${act.title}` });
            const outKey = dayKey(act.endDate) || key;
            if (outKey !== key || act.endTime) {
              const out = atTime(outKey, act.endTime);
              events.push({ ...base, key: outKey, time: act.endTime, start: out, end: new Date(+out + DEFAULT_DURATION_MS), label: `เช็คเอาท์ ${act.title}`, icon: "fa-solid fa-right-from-bracket" });
            }
            return;
          }
          const start = atTime(key, act.startTime);
          let end;
          if (!act.startTime) {
            end = new Date(+start + 86400000); // ทั้งวัน
          } else if (act.endTime) {
            // เวลาถัดไปที่น้อยกว่าเวลาก่อนหน้า = ข้ามวัน (เครื่องบินต่อเครื่องข้ามได้หลายวัน)
            const stops = act.category === "TRAVEL" && act.transportMode === "PLANE" ? act.stops || [] : [];
            const times = [act.startTime, ...stops.flatMap((st) => [st.arriveTime, st.departTime]), act.endTime]
              .filter(Boolean)
              .map((t) => atTime(key, t));
            for (let i = 1; i < times.length; i++) {
              while (times[i] <= times[i - 1]) times[i] = new Date(+times[i] + 86400000);
            }
            end = times[times.length - 1];
          } else {
            end = new Date(+start + DEFAULT_DURATION_MS);
          }
          const modeIcon = act.category === "TRAVEL" ? MODE_ICONS[act.transportMode] : null;
          events.push({ ...base, key, time: act.startTime, start, end, label: act.title, icon: modeIcon || icon });
        });
        return events.sort((a, b) => a.start - b.start || !!a.time - !!b.time);
      }

      function untilText(ev, now) {
        const mins = Math.round((ev.start - now) / 60000);
        const today = localKey(now);
        const tomorrow = localKey(new Date(+now + 86400000));
        if (!ev.time) {
          if (ev.key === tomorrow) return "พรุ่งนี้ · ทั้งวัน";
          return `อีก ${Math.max(Math.round((atTime(ev.key) - atTime(today)) / 86400000), 1)} วัน · ทั้งวัน`;
        }
        if (ev.key === today) {
          if (mins < 60) return `อีก ${Math.max(mins, 1)} นาที`;
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          return `อีก ${h} ชม.${m ? ` ${m} นาที` : ""}`;
        }
        if (ev.key === tomorrow) return `พรุ่งนี้ ${hhmm(ev.time)}`;
        return `อีก ${Math.round((atTime(ev.key) - atTime(today)) / 86400000)} วัน`;
      }

      function eventSub(ev) {
        const act = ev.act;
        if (act.category === "TRAVEL" && act.origin && act.location) {
          const via = act.transportMode === "PLANE" ? (act.stops || []).map((st) => st.place) : [];
          return [act.origin, ...via, act.location].join(" → ");
        }
        return act.location || "";
      }

      function renderNextCard() {
        const card = document.getElementById("next-card");
        if (!planActivities) {
          card.classList.add("hidden");
          return;
        }
        const planUrl = (key) =>
          `plan.html?tripId=${encodeURIComponent(tripId)}${key ? `#day-${key}` : ""}`;
        const show = ({ icon, color, label, title, sub, go, href }) => {
          card.style.setProperty("--cat", color);
          card.href = href;
          card.innerHTML = `
            <div class="next-icon"><i class="${icon}"></i></div>
            <div class="next-body">
              <div class="next-label">${label}</div>
              <div class="next-title">${title}</div>
              ${sub ? `<div class="next-sub">${sub}</div>` : ""}
            </div>
            <span class="next-go"><span>${go} </span><i class="fa-solid fa-arrow-right"></i></span>`;
          card.classList.remove("hidden");
        };

        const events = planEvents(planActivities);
        if (!events.length) {
          show({
            icon: "fa-solid fa-route",
            color: "#7c3aed",
            label: "แพลนเที่ยว",
            title: "ยังไม่มีแพลน",
            sub: "วางแพลนทั้งทริปไว้ ตรงนี้จะบอกว่าต้องไปไหนต่อ",
            go: "วางแพลน",
            href: planUrl(),
          });
          return;
        }

        const now = zoneNow(tripTimeZone);
        const current = events.find((ev) => ev.time && ev.start <= now && now < ev.end);
        const upcoming = events.filter((ev) => ev.start > now);
        const main = current || upcoming[0];
        if (!main) {
          show({
            icon: "fa-solid fa-flag-checkered",
            color: "#16a34a",
            label: "แพลนเที่ยว",
            title: "เที่ยวครบทุกรายการแล้ว",
            sub: `ทั้งหมด ${planActivities.length} รายการ`,
            go: "ดูแพลน",
            href: planUrl(),
          });
          return;
        }

        const after = upcoming.find((ev) => ev !== main);
        const label = current
          ? `<span class="now">ตอนนี้</span>${
              current.act.endTime && current.act.category !== "STAY" ? ` ถึง ${esc(hhmm(current.act.endTime))}` : ""
            }`
          : `ถัดไป · ${esc(untilText(main, now))}`;
        const subParts = [
          eventSub(main),
          after
            ? `ต่อจากนั้น ${after.time && after.key === main.key ? hhmm(after.time) : formatDay(atTime(after.key))} ${after.label}`
            : "",
        ].filter(Boolean);
        show({
          icon: main.icon,
          color: main.color,
          label,
          title: `${main.time ? `<span class="time">${esc(hhmm(main.time))}</span>` : ""}${esc(main.label)}`,
          sub: esc(subParts.join(" · ")),
          go: "ดูแพลน",
          href: planUrl(main.key),
        });
      }

      // แพลนแยกโหลด: โหลดไม่ได้ก็ไม่กระทบส่วนอื่นของหน้า

      // คัดลอกรหัสเชิญ แล้วเปลี่ยนปุ่มเป็นสีเขียวชั่วครู่
      let copyTimeout;
      function copyInviteCode() {
        const code = document
          .getElementById("invite-code-display")
          .textContent.trim();
        if (!code || code === "------") return;

        navigator.clipboard
          .writeText(code)
          .then(() => {
            const btn = document.getElementById("copyBtn");
            const icon = document.getElementById("copyIcon");
            const textSpan = document.getElementById("copyText");

            clearTimeout(copyTimeout);
            btn.classList.add("success");
            icon.className = "fa-solid fa-check";
            textSpan.textContent = "คัดลอกแล้ว";

            copyTimeout = setTimeout(() => {
              btn.classList.remove("success");
              icon.className = "fa-regular fa-copy";
              textSpan.textContent = "คัดลอก";
            }, 1500);
          })
          .catch((err) => {
            console.error("ไม่สามารถคัดลอกข้อความได้:", err);
            showToast("คัดลอกไม่สำเร็จ", "error");
          });
      }

      loadTripDashboard();
      loadPlan();
      // ทุกนาที: โหลดแพลนใหม่ (เพื่อนอาจแก้) แล้วอัปเดต "อีก X นาที / ตอนนี้"
      setInterval(() => {
        if (document.hidden) renderNextCard();
        else loadPlan();
      }, 60000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadPlan();
      });
    </script>
  </body>
</html>
